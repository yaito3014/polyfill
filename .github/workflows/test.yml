name: Test

permissions:
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths: &paths-to-detect
      - "include/**/*"
      - "test/**/*"
      - ".github/workflows/**/*"
  pull_request:
    branches:
      - main
    paths: *paths-to-detect

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu
            version: 24.04
          - name: windows
            version: 2025-vs2026
        build-type:
          - Debug
          - Release
        compiler:
          - name: GCC
            version: 14
            executable: g++-14
          - name: Clang
            version: 21
            executable: clang++-21
          - name: Clang
            version: 21
            executable: clang++-21
            stdlib: libc++
          - name: MSVC
            version: 2022
            executable: cl
            platform-toolset: v143
            toolset-prefix: "14.44"
          - name: MSVC
            version: 2026
            executable: cl
            platform-toolset: v145
            toolset-prefix: "14.5"
        cxx-version: [11, 14, 17, 20, 23, 26]
        exclude:
          - os:
              name: windows
            compiler:
              name: GCC
          - os:
              name: windows
            compiler:
              name: Clang
          - os:
              name: ubuntu
            compiler:
              name: MSVC
          - compiler:
              name: MSVC
            cxx-version: 11
          - compiler:
              name: MSVC
            cxx-version: 26
    name: C++${{ matrix.cxx-version }} ${{ matrix.build-type }} (${{ matrix.compiler.name }}${{ matrix.compiler.stdlib && format(' {0}', matrix.compiler.stdlib) || '' }} ${{ matrix.compiler.version }} on ${{ matrix.os.name }})
    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Init Ubuntu
        if: matrix.os.name == 'ubuntu'
        run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
          sudo apt-get update
      - name: Setup GCC
        if: matrix.compiler.name == 'GCC'
        run: |
          sudo apt-get install g++-${{ matrix.compiler.version }}
      - name: Setup Clang
        if: matrix.compiler.name == 'Clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh ${{ matrix.compiler.version }} all
      # Runner images replace toolsets on update (e.g. 14.51 by 14.52), so use
      # the newest installed one matching the prefix instead of a fixed version.
      - name: Detect MSVC toolset
        id: msvc-toolset
        if: matrix.compiler.name == 'MSVC'
        shell: pwsh
        env:
          TOOLSET_PREFIX: ${{ matrix.compiler.toolset-prefix }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $available = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | ForEach-Object Name
          Write-Output "Installed MSVC toolsets: $($available -join ', ')"
          $match = $available | Where-Object { $_.StartsWith("$env:TOOLSET_PREFIX") } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $match) {
            Write-Output "::error::No installed MSVC toolset starts with $env:TOOLSET_PREFIX"
            exit 1
          }
          $version = ([version]$match).ToString(2)
          Write-Output "Using MSVC toolset $version ($match)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "full-version=$match" >> $env:GITHUB_OUTPUT
      - name: Setup MSVC
        if: matrix.compiler.name == 'MSVC'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
          toolset: ${{ steps.msvc-toolset.outputs.version }}
      # The cached FetchContent sub-builds record the MSVC toolset they were
      # configured with, and CMake refuses to reuse them with another one.
      - name: Restore deps from cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: build/_deps
          key: ${{ matrix.cxx-version }}-${{ matrix.build-type }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}${{ matrix.compiler.stdlib && format('-{0}', matrix.compiler.stdlib) || '' }}-${{ matrix.os.name }}-${{ matrix.os.version }}${{ steps.msvc-toolset.outputs.full-version && format('-{0}', steps.msvc-toolset.outputs.full-version) || '' }}
      - name: Configure
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=${{ matrix.cxx-version }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler.executable }} ${{ matrix.compiler.stdlib && format('-DCMAKE_CXX_FLAGS=-stdlib={0} -DCMAKE_EXE_LINKER_FLAGS=-stdlib={0}', matrix.compiler.stdlib) || '' }} ${{ matrix.compiler.name == 'MSVC' && format('-T {0},version={1}', matrix.compiler.platform-toolset, steps.msvc-toolset.outputs.version) || '' }} -DYK_POLYFILL_CI=ON -Bbuild .
      - name: Build tests
        run: |
          echo "CPPWARNINGNOTIFIER_LOG_MARKER"
          cmake --build build --config ${{ matrix.build-type }}
      - name: Save deps to cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/_deps
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Run test
        working-directory: build/test
        run: |
          ctest -C ${{ matrix.build-type }}
  run-notifier:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: iris-cpp/cpp-warning-notifier@v0.7
        with:
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ job.check_run_id }}
          JOB_REGEX: C\+\+(?<cppVersion>\d+) (?<config>.+) \((?<vendorName>.+) (?<vendorVersion>.+) on (?<osName>.+)\)
          STEP_REGEX: Build.+
          ROW_HEADERS: '["osName", "vendorName", "vendorVersion", "config"]'
          COLUMN_HEADER: cppVersion
